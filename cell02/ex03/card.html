<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <div class="card">
        <div class="header">User Profile Card</div>

        <table class="info-table">
            <tr>
                <td>
                    <img class="avatar" src="https://i.pinimg.com/736x/24/4a/33/244a335b6b4c56d81f804df0bd03a95a.jpg" alt="profile picture">
                </td>
            </tr>
            <tr>
                <td class="login">puwongja</td>
            </tr>
            <tr>
                <td class="description">KMITL Student</td>
            </tr>
            <tr>
                <td>
                    <a href="#"><img class="social" src="https://placehold.co/40x40/1a1a2e/ffffff?text=FB" alt="Facebook"></a>
                    <a href="#"><img class="social" src="https://placehold.co/40x40/1a1a2e/ffffff?text=GH" alt="GitHub"></a>
                    <a href="#"><img class="social" src="https://placehold.co/40x40/1a1a2e/ffffff?text=IG" alt="Instagram"></a>
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
